# Google Analytics 4 with Consent Mode v2 and an EU cookie-consent banner.
# Setting `ga_id` enables the GA loader and consent banner wired into
# _layouts/default.html. Consent defaults to denied until the visitor accepts.
ga_id: G-1KZ5D306QK

# GitHub Pages project site — makes absolute/relative URLs resolve correctly.
url: https://devrkd.github.io
baseurl: /agentic-workflow

# Every Markdown page renders through the custom layout in _layouts/default.html.
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default

